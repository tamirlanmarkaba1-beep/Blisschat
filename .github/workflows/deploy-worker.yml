name: Deploy push worker

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare-worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets exist
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$T" ] || { echo "::error::Секрет CLOUDFLARE_API_TOKEN пустой или не добавлен"; exit 1; }
          [ -n "$A" ] || { echo "::error::Секрет CLOUDFLARE_ACCOUNT_ID пустой или не добавлен"; exit 1; }
          [ -n "$S" ] || { echo "::error::Секрет SERVICE_ACCOUNT_JSON пустой или не добавлен"; exit 1; }
          echo "$S" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['type']=='service_account' and d['project_id']=='bitrate-71684'" \
            || { echo "::error::SERVICE_ACCOUNT_JSON не похож на ключ сервисного аккаунта проекта bitrate-71684"; exit 1; }

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Upload service account secret
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" | npx --yes wrangler@3 secret put SERVICE_ACCOUNT_JSON
