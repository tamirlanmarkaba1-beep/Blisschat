name: Build blisschat glass

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
      - name: Build glass APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -Pglass=true --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk blisschat-glass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blisschat-glass-apk
          path: blisschat-glass.apk
      - name: Attach to the latest release (waits for the main build to create it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            tag=$(gh release list -L 1 --json tagName -q '.[0].tagName' || true)
            if [ -n "$tag" ]; then
              gh release upload "$tag" blisschat-glass.apk --clobber && exit 0
            fi
            sleep 20
          done
          echo "No release found; the APK is available as a workflow artifact."
